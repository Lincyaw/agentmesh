name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Run Rust and interoperability checks
        env:
          AGENTMESH_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/agentmesh
        run: |
          cargo test --release --locked --target '${{ matrix.target }}'
          python3 tests/test_cli.py
          python3 tests/test_setup.py
          python3 tests/test_auto_binding.py
          python3 tests/test_invites.py
          python3 tests/test_interop.py
      - name: Package binary
        run: python3 scripts/package_release.py --binary 'target/${{ matrix.target }}/release/agentmesh' --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: agentmesh-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
  draft:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Create draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$RELEASE_TAG" = "v$VERSION"
          git archive --format=tar.gz --prefix="agentmesh-v$VERSION/" --output="dist/release/agentmesh-v$VERSION-source.tar.gz" HEAD
          (cd dist/release && sha256sum *.tar.gz > SHA256SUMS)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Agentmesh $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dist/release/*.tar.gz dist/release/SHA256SUMS --clobber
