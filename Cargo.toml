[package]
name = "agentmesh"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
description = "Peer-to-peer MCP mailboxes and remote workspaces for coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
fs2 = "0.4"
futures = "0.3"
iroh = "1"
libc = "0.2"
rmcp = { version = "3", features = ["server", "macros", "schemars", "transport-io"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml_edit = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
